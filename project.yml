    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AIMXIOS:
    type: application
    platform: iOS
    sources:
      - path: AIMXIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimx.ios
